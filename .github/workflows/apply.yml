name: Terraform Apply

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-state
  cancel-in-progress: false # never stop an apply halfway

env:
  TF_VERSION: "~1.14"
  TF_IN_AUTOMATION: "true"

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: production # waits for your approval; also sets the OIDC "sub" claim
    defaults:
      run:
        working-directory: infra

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: us-east-2

      - name: Init
        run: >
          terraform init -input=false
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="kms_key_id=${{ vars.TF_STATE_KMS_KEY_ARN }}"

      - name: Apply
        run: terraform apply -auto-approve -input=false

      - name: Invalidate CloudFront cache (once the site exists)
        run: |
          # Only a real CloudFront ID (e.g. E2ABC123XYZ) triggers an invalidation;
          # empty output or a "No outputs found" warning is skipped.
          DIST_ID=$(terraform output -raw distribution_id 2>/dev/null || true)
          if echo "$DIST_ID" | grep -Eq '^E[A-Z0-9]+$'; then
            aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/*"
          else
            echo "No distribution yet, skipping invalidation."
          fi
