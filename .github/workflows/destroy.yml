name: Terraform Destroy

# Manual only: Actions tab > Terraform Destroy > Run workflow, type "destroy".
# Use it to stop all infra/ costs between study sessions.
# bootstrap/ (state bucket, budget, OIDC roles) is not touched.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "destroy" to delete everything in infra/'
        required: true

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-state
  cancel-in-progress: false

env:
  TF_VERSION: "~1.14"
  TF_IN_AUTOMATION: "true"

jobs:
  destroy:
    if: ${{ github.event.inputs.confirm == 'destroy' }}
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: infra

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: us-east-2

      - name: Init
        run: >
          terraform init -input=false
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="kms_key_id=${{ vars.TF_STATE_KMS_KEY_ARN }}"

      - name: Destroy
        run: terraform destroy -auto-approve -input=false
